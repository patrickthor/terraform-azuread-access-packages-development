name: deploy

# Repo 2 (access-packages). Builds catalogs, access packages and the gate 1 assignment
# policies from repo 1's contract.
#
# APPLY ORDER. In the reference architecture both modules live in one root config and the
# contract flows in memory, so apply order is a property of the dependency graph and cannot
# be got wrong. This repo's own root is the split-state variant, where it can: the plan
# cannot resolve without repo 1's state, which catches the empty case, but a STALE state
# still plans cleanly.
#
# That matters concretely. For pim_for_groups roles it is the act of writing the PIM policy
# that onboards the group to PIM for Groups, and until then the platform does not offer
# EligibleMember as a resource role at all. Apply out of order and you get standing access
# where eligibility was intended, with nothing failing.
#
# If both repos ever run in one pipeline, the vending job must be a `needs:` dependency:
#
#   jobs:
#     vending:
#       ...
#     access-packages:
#       needs: vending        # ← not optional
#
# Without it, GitHub Actions runs them in parallel and repo 2 may win the race.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC federated credential. No client secret stored anywhere.

env:
  TF_VERSION: "1.9.8"
  ARM_USE_AZUREAD: "true" # Entra auth to the state storage account, not an account key
  ARM_USE_OIDC: "true"

concurrency:
  # Two applies against the same catalog would race on the resource associations.
  group: access-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------------
  # Static checks. No cloud credentials, so this runs on forks and untrusted PRs too.
  # ----------------------------------------------------------------------------------
  validate:
    name: fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: validate root
        run: |
          terraform init -backend=false
          terraform validate

      - name: validate modules
        run: |
          for dir in modules/access-packages modules/access-packages/modules/*/; do
            echo "==> ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
          done

      - name: validate examples
        run: |
          for dir in examples/*/; do
            echo "==> ${dir}"
            terraform -chdir="${dir}" init -backend=false
            terraform -chdir="${dir}" validate
          done

      # ----------------------------------------------------------------------------
      # Contract and structural invariants
      #
      # All cheap, all easy to break by accident, and all producing breakage that only
      # shows up in somebody else's repo.
      # ----------------------------------------------------------------------------

      # A module with a provider block cannot be used with count, for_each or depends_on.
      # examples/two-module-root uses count on the module, so this is load-bearing.
      - name: assert no provider blocks in any module
        run: |
          if grep -rEn '^\s*provider\s+"' modules/ --include='*.tf'; then
            echo "::error::provider block found under modules/."
            echo "Provider config belongs to the root and to examples/*/providers.tf."
            echo "A module with a provider block cannot be used with count, for_each or depends_on."
            exit 1
          fi
          echo "OK: no provider blocks."

      # The module must never read a remote state. The root decides where the contract
      # comes from; the module takes a plain typed object.
      - name: assert no remote state read inside the module
        run: |
          if grep -rEn 'terraform_remote_state' modules/ --include='*.tf'; then
            echo "::error::terraform_remote_state found under modules/."
            echo "The module takes a typed object. Where the contract comes from is the root's decision."
            exit 1
          fi
          echo "OK: no remote state reads in modules."

      # try() around a contract field is how a missing access_type becomes standing access.
      # contract_version handles compatibility instead, and it fails loudly.
      - name: assert no try around contract fields
        run: |
          if grep -rEn 'try\(\s*(var\.vending|local\.v)\.' modules/ --include='*.tf'; then
            echo "::error::try() wrapping a contract field."
            echo "The contract's fields are required and contract_version handles compatibility."
            echo "A try() here silently turns a missing access_type into standing access."
            exit 1
          fi
          echo "OK: no try() around contract fields."

      # Terraform does not dependably short-circuit && and ||, so `x != null && <compare x>`
      # still evaluates the comparison and fails the whole expression with "argument must
      # not be null". Whether it short-circuits varies by Terraform version and by whether
      # the operands are known at plan time, so this bug reaches consumers' plans without
      # ever appearing locally. Filter nulls in a `for` clause instead.
      #
      # Comment lines are excluded, since the rule itself is documented in prose.
      - name: assert no compound null guards
        run: |
          if grep -rnE '!= *null *&&|&& *[a-z_.]+ *!= *null|== *null *\|\|' modules/ --include='*.tf' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::compound null guard found under modules/."
            echo "Terraform does not dependably short-circuit && or ||, so the guarded"
            echo "expression is still evaluated and fails with 'argument must not be null'."
            echo "Filter the nulls out in a for clause and key the result only on the"
            echo "entries that survived. See the null-handling note in locals.tf."
            exit 1
          fi
          echo "OK: no compound null guards."

      # Repo 2 must never write a group name or a scope key. Everything comes from the
      # contract. Examples hold fixtures, so they are exempt.
      - name: assert no hardcoded group names or scope keys
        run: |
          if grep -rEn '"(azure|aws|gcp|github|entra)-[a-z0-9-]+-[a-z0-9-]+"' modules/ --include='*.tf'; then
            echo "::error::what looks like a hardcoded group name under modules/."
            echo "Every group name and scope key comes from var.vending."
            exit 1
          fi
          echo "OK: no hardcoded group names."

      # Modules must not become a version ceiling for consumers.
      - name: assert modules use >= provider constraints
        run: |
          if grep -rEn 'version\s*=\s*"~>' modules/ --include='versions.tf'; then
            echo "::error::a module pins a provider with ~>."
            echo "Modules use >= so they never become a ceiling. Roots use ~> and commit a lockfile."
            exit 1
          fi
          echo "OK: modules use >=."

      # Repo 2 must not write to repo 1's state key.
      - name: assert the backend key is not repo 1's
        run: |
          if grep -nE '^\s*key\s*=' backend.hcl.example | grep -q 'access-vending'; then
            echo "::error::backend.hcl.example writes to repo 1's state key."
            echo "That would destroy the contract this root depends on."
            exit 1
          fi
          echo "OK: backend key is separate from repo 1's."

      # The contract file is the interface between the repos and must not drift.
      - name: remind about contract drift
        run: |
          echo "::notice::.kiro/steering/identity-governance-contract.md must be byte-identical in both repos. If this PR changed it, the paired PR in terraform-azuread-access-vending-development is required, and contract_version may need a bump."

  # ----------------------------------------------------------------------------------
  # Plan. Needs cloud credentials, so it is gated on the static checks.
  # ----------------------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    needs: validate
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        run: terraform init -backend-config=backend.hcl
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # A failure here is usually one of: repo 1 not applied yet (empty contract), a
      # contract_version mismatch, missing Storage Blob Data Reader on repo 1's state
      # account, or one of the preconditions in modules/access-packages/main.tf catching a
      # real problem. The error messages say which.
      - name: plan
        run: terraform plan -input=false -out=tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # Not uploaded as an artifact: the plan contains group object IDs and systemeier UPNs,
      # and workflow artifacts are readable by anyone with repo read access.
      - name: plan summary
        run: terraform show -no-color tfplan | head -200

  # ----------------------------------------------------------------------------------
  # Apply. main only.
  # ----------------------------------------------------------------------------------
  apply:
    name: apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: poc
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        run: terraform init -backend-config=backend.hcl
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # Re-planned rather than applying the artifact from the plan job, since the plan file
      # was deliberately not passed between jobs.
      - name: apply
        run: terraform apply -input=false -auto-approve
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      # A green apply does NOT mean the access model holds. Surfacing this in the job summary
      # means nobody has to remember to run terraform output.
      - name: report what Terraform could not do
        run: |
          {
            echo "## Manual steps still required"
            echo
            echo '```json'
            terraform output -json manual_steps_required
            echo '```'
            echo
            echo "## Resource roles excluded from IaC"
            echo
            echo '```json'
            terraform output -json excluded_resource_roles
            echo '```'
            echo
            echo "## Packages by catalog"
            echo
            echo "A catalog is a delegation boundary, so this listing is security-relevant."
            echo
            echo '```json'
            terraform output -json packages_by_catalog
            echo '```'
            echo
            echo "## Verification summary"
            echo
            echo '```json'
            terraform output -json verification_summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
